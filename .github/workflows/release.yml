name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build macOS binaries and create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist

          for arch in amd64 arm64; do
            GOOS=darwin GOARCH="$arch" CGO_ENABLED=0 go build \
              -trimpath \
              -ldflags "-s -w -X github.com/stonkol/wallah/internal/cli.version=${version}" \
              -o dist/wallah .

            archive="wallah_${version}_darwin_${arch}.tar.gz"
            tar -czf "dist/${archive}" -C dist wallah
            rm dist/wallah
          done

          (cd dist && sha256sum *.tar.gz > checksums.txt)
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/checksums.txt \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
