name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read release version from commit message
        id: version
        shell: bash
        run: |
          subject="$(git log -1 --pretty=%s)"
          if [[ "$subject" =~ ^(v[0-9]+\.[0-9]+\.[0-9]+)([[:space:]:]|$) ]]; then
            echo "tag=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Go
        if: steps.version.outputs.tag != ''
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build macOS binaries and create release
        if: steps.version.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail

          version="${RELEASE_TAG#v}"
          mkdir -p dist

          for arch in amd64 arm64; do
            GOOS=darwin GOARCH="$arch" CGO_ENABLED=0 go build \
              -trimpath \
              -ldflags "-s -w -X github.com/stonkol/wallah/internal/cli.version=${version}" \
              -o dist/wallah .

            archive="wallah_${version}_darwin_${arch}.tar.gz"
            tar -czf "dist/${archive}" -C dist wallah
            rm dist/wallah
          done

          (cd dist && sha256sum *.tar.gz > checksums.txt)
          gh release create "$RELEASE_TAG" dist/*.tar.gz dist/checksums.txt \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --generate-notes
